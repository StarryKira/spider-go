app:
  port: 8080
  env: production

cors:
  allow_origins:
    - "http://localhost:3000"
    - "http://localhost:5173"
    - "http://127.0.0.1:3000"
    - "http://127.0.0.1:5173"
  allow_methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
  allow_headers: ["Origin", "Content-Type", "Authorization", "Accept"]
  expose_headers: ["Content-Length"]
  allow_credentials: true
  max_age: 43200

database:
  driver: mysql
  source: mysql
  port: 3306
  user: spider_go
  pass: spider_go_local
  name: spider_go

redis:
  session:
    host: redis:6379
    pass: spider_redis_local
    db: 0
  captcha:
    host: redis:6379
    pass: spider_redis_local
    db: 1

jwt:
  secret: "replace-with-a-long-random-secret"
  issuer: "spider-go-local"

