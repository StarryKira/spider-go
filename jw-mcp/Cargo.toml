[package]
name = "csuft-jw-mcp"
version = "0.1.0"
edition = "2021"
description = "Read-only CSUFT academic MCP for Claude Code"
license = "MIT"
authors = ["spider-go"]

[lib]
name = "csuft_jw_mcp"
path = "src/lib.rs"

[[bin]]
name = "csuft-jw-mcp"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
dirs = "6"
futures-util = "0.3"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
scraper = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "time"] }
tokio-tungstenite = "0.26"
url = "2"
wreq = "5"
wreq-util = { version = "2", features = ["emulation"] }
